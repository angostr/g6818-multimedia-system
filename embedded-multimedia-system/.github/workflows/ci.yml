name: CI

on:
  push:
  pull_request:

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check (host gcc, no board needed)
        run: make -C embedded-multimedia-system CC=gcc check

  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM cross toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-linux-gnueabihf
      - name: Cross compile for GE6818 (ARM)
        run: make -C embedded-multimedia-system
      - name: Confirm output is an ARM binary
        run: file embedded-multimedia-system/multimedia_system
